<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" class="tka" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <style>
    /* Inline on the docs site: the page tokens apply. On GitHub the fallback colors apply. */
    .tka { --t-bg: var(--ui-bg, #ffffff); --t-panel: var(--ui-bg-elevated, #f7f8fa); --t-line: var(--ui-border-accented, #dadde2);
      --t-hi: var(--ui-text-highlighted, #17181c); --t-muted: var(--ui-text-muted, #5b606b); --t-pri: var(--docs-link, #2563eb); --t-soft: var(--docs-link-soft, #eff4ff);
      --t-no: var(--docs-delete, #b91c1c); --t-no-bg: var(--docs-delete-bg, #fef2f2); }
    @media (prefers-color-scheme: dark) {
      .tka { --t-bg: var(--ui-bg, #17181c); --t-panel: var(--ui-bg-elevated, #1e2025); --t-line: var(--ui-border-accented, #34373e);
        --t-hi: var(--ui-text-highlighted, #f4f5f7); --t-muted: var(--ui-text-muted, #9ea3ad); --t-pri: var(--docs-link, #60a5fa); --t-soft: var(--docs-link-soft, #172036);
        --t-no: var(--docs-delete, #fca5a5); --t-no-bg: var(--docs-delete-bg, #2c1414); }
    }
    .tka .level { stroke: var(--t-line); }
    .tka .l-update { fill: var(--t-panel); }
    .tka .l-comment { fill: var(--t-bg); }
    .tka .l-read { fill: var(--t-soft); stroke: var(--t-pri); }
    .tka .chip { fill: var(--t-hi); }
    .tka .chip-text { fill: var(--t-bg); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; }
    .tka .chip-read { fill: var(--t-pri); }
    .tka .what { fill: var(--t-hi); font-size: 13px; font-weight: 500; }
    .tka .route { fill: var(--t-muted); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; }
    .tka .never { fill: var(--t-no-bg); stroke: var(--t-no); stroke-opacity: 0.35; }
    .tka .never-title { fill: var(--t-no); font-size: 13px; font-weight: 600; }
    .tka .never-text { fill: var(--t-hi); font-size: 12.5px; }
    .tka .icon { stroke: var(--t-no); stroke-width: 1.8; fill: none; stroke-linecap: round; }
  </style>

  <rect class="level l-update" x="1" y="1" width="838" height="270" rx="16"/>
  <rect class="chip" x="22" y="20" width="62" height="22" rx="6"/><text class="chip-text" x="53" y="35" text-anchor="middle">update</text>
  <text class="what" x="98" y="36">Also change the Status, Priority, assignee and Fields</text>
  <text class="route" x="98" y="56">PATCH /api/v1/tickets/{ref}</text>

  <rect class="level l-comment" x="22" y="74" width="796" height="178" rx="12"/>
  <rect class="chip" x="42" y="92" width="72" height="22" rx="6"/><text class="chip-text" x="78" y="107" text-anchor="middle">comment</text>
  <text class="what" x="128" y="108">Also add a Public Comment or an Internal Comment</text>
  <text class="route" x="128" y="128">POST /api/v1/tickets/{ref}/comments</text>

  <rect class="level l-read" x="42" y="146" width="756" height="88" rx="10"/>
  <rect class="chip chip-read" x="62" y="164" width="48" height="22" rx="6"/><text class="chip-text" x="86" y="179" text-anchor="middle">read</text>
  <text class="what" x="124" y="180">Get the ticket, its comments and its Activity (the default)</text>
  <text class="route" x="124" y="200">GET /api/v1/tickets/{ref}</text>
  <text class="route" x="124" y="218">GET /api/v1/tickets/{ref}/comments · GET /api/v1/tickets/{ref}/activity</text>

  <rect class="never" x="1" y="286" width="838" height="92" rx="12"/>
  <circle class="icon" cx="30" cy="310" r="9"/><path class="icon" d="M23.6 316.4 36.4 303.6"/>
  <text class="never-title" x="50" y="315">Never with a token</text>
  <text class="never-text" x="50" y="338">Lists or search, a type change, a Team move, a description edit, Participants, attachments,</text>
  <text class="never-text" x="50" y="358">cancel, reopen, delete, revert, or any admin route. People do those in Tikki.</text>
</svg>
