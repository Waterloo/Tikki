<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" class="tkm" data-steps="4" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <style>
    /* Inline on the docs site: the page tokens apply, and docs.js sets data-step. On GitHub the fallback colors apply. */
    .tkm { --t-bg: var(--ui-bg, #ffffff); --t-panel: var(--ui-bg-elevated, #f7f8fa); --t-skel: var(--ui-bg-accented, #e9ebee); --t-line: var(--ui-border-accented, #dadde2);
      --t-hi: var(--ui-text-highlighted, #17181c); --t-muted: var(--ui-text-muted, #5b606b); --t-pri: var(--docs-link, #2563eb); --t-soft: var(--docs-link-soft, #eff4ff);
      --t-warn: var(--docs-warn-text, #6b4a0c); --t-warn-bg: var(--docs-warn-bg, #fff8eb); }
    @media (prefers-color-scheme: dark) {
      .tkm { --t-bg: var(--ui-bg, #17181c); --t-panel: var(--ui-bg-elevated, #1e2025); --t-skel: var(--ui-bg-accented, #26282e); --t-line: var(--ui-border-accented, #34373e);
        --t-hi: var(--ui-text-highlighted, #f4f5f7); --t-muted: var(--ui-text-muted, #9ea3ad); --t-pri: var(--docs-link, #60a5fa); --t-soft: var(--docs-link-soft, #172036);
        --t-warn: var(--docs-warn-text, #f2d08a); --t-warn-bg: var(--docs-warn-bg, #241d10); }
    }
    .tkm .station { fill: var(--t-panel); stroke: var(--t-line); }
    .tkm .box { fill: var(--t-bg); stroke: var(--t-line); }
    .tkm .soft { fill: var(--t-soft); stroke: var(--t-pri); }
    .tkm .skel { fill: var(--t-skel); }
    .tkm .who { fill: var(--t-muted); font-size: 11.5px; font-weight: 500; }
    .tkm .title { fill: var(--t-hi); font-size: 14px; font-weight: 600; }
    .tkm .small { fill: var(--t-hi); font-size: 12px; font-weight: 600; }
    .tkm .note { fill: var(--t-muted); font-size: 12px; }
    .tkm .mono { fill: var(--t-hi); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; }
    .tkm .btn-pri { fill: var(--t-hi); }
    .tkm .btn-pri-text { fill: var(--t-bg); font-size: 11.5px; font-weight: 600; }
    .tkm .btn-text { fill: var(--t-hi); font-size: 11.5px; font-weight: 500; }
    .tkm .warn { fill: var(--t-warn-bg); }
    .tkm .warn-text { fill: var(--t-warn); font-size: 11.5px; font-weight: 500; }
    .tkm .check { stroke: var(--t-pri); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .tkm .icon { stroke: var(--t-muted); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .tkm .wire { stroke: var(--t-muted); stroke-width: 1.5; fill: none; }
    .tkm .loop { stroke-dasharray: 4 4; }
    .tkm .head { fill: var(--t-muted); }
    .tkm .dot { fill: var(--t-pri); }
    .tkm .dot-n { fill: var(--t-bg); font-size: 11px; font-weight: 700; }
    .tkm .packet { fill: var(--t-pri); opacity: 0; }
    .tkm .step { transition: opacity 0.2s; }
    .tkm[data-step] .step { opacity: 0.28; }
    .tkm[data-step="1"] .step-1, .tkm[data-step="2"] .step-2, .tkm[data-step="3"] .step-3, .tkm[data-step="4"] .step-4 { opacity: 1; }
    .tkm[data-step="2"] .step-2 .wire, .tkm[data-step="3"] .step-3 .wire, .tkm[data-step="4"] .step-4 .wire { stroke: var(--t-pri); stroke-width: 2; }
    .tkm[data-step] .packet { opacity: 1; }
  </style>
  <defs>
    <marker id="tkm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <!-- 1: you publish the manifest. -->
  <g class="step step-1">
    <rect class="station" x="1" y="1" width="178" height="262" rx="14"/>
    <circle class="dot" cx="24" cy="26" r="10"/><text class="dot-n" x="24" y="30" text-anchor="middle">1</text>
    <text class="who" x="42" y="30">YOUR SITE</text>
    <text class="title" x="16" y="62">You publish</text>
    <rect class="box" x="16" y="78" width="148" height="108" rx="8"/>
    <path class="icon" d="M30 92h10l6 6v14H30z M40 92v6h6"/>
    <text class="mono" x="54" y="106">tikki-app.json</text>
    <text class="note" x="30" y="132">name, urls, icons</text>
    <text class="note" x="30" y="150">asks for: <tspan class="mono">comment</tspan></text>
    <rect class="skel" x="30" y="164" width="96" height="7" rx="3.5"/>
    <text class="note" x="16" y="214">One JSON file, at an</text>
    <text class="note" x="16" y="231">https address</text>
    <path data-path="" d="M90 186V200" fill="none"/>
  </g>

  <!-- 2: Tikki fetches it on its server and shows a preview. -->
  <g class="step step-2">
    <path class="wire" data-path="" d="M181 132H219" marker-end="url(#tkm-arrow)"/>
    <rect class="station" x="221" y="1" width="178" height="262" rx="14"/>
    <circle class="dot" cx="244" cy="26" r="10"/><text class="dot-n" x="244" y="30" text-anchor="middle">2</text>
    <text class="who" x="262" y="30">TIKKI SERVER</text>
    <text class="title" x="236" y="62">Fetch and preview</text>
    <rect class="box" x="236" y="78" width="148" height="108" rx="8"/>
    <rect class="soft" x="248" y="90" width="22" height="22" rx="5"/>
    <rect class="box" x="274" y="90" width="22" height="22" rx="5"/>
    <text class="small" x="248" y="132">Time tracking</text>
    <text class="note" x="248" y="150">sidebar · tab · page</text>
    <text class="note" x="248" y="168">asks for comment</text>
    <text class="note" x="236" y="214">On Tikki's server, never</text>
    <text class="note" x="236" y="231">in the Admin's browser</text>
  </g>

  <!-- 3: the Admin grants; Tikki copies the icons and saves the app. -->
  <g class="step step-3">
    <path class="wire" data-path="" d="M401 132H439" marker-end="url(#tkm-arrow)"/>
    <rect class="station" x="441" y="1" width="178" height="262" rx="14"/>
    <circle class="dot" cx="464" cy="26" r="10"/><text class="dot-n" x="464" y="30" text-anchor="middle">3</text>
    <text class="who" x="482" y="30">THE ADMIN</text>
    <text class="title" x="456" y="62">Grant and add</text>
    <rect class="box" x="456" y="78" width="148" height="108" rx="8"/>
    <path class="check" d="M468 98l4 4 7-8"/><text class="note" x="486" y="102">Show on: all types</text>
    <path class="check" d="M468 122l4 4 7-8"/><text class="note" x="486" y="126">Access: <tspan class="mono">comment</tspan></text>
    <text class="note" x="468" y="148">or lower, never higher</text>
    <rect class="btn-pri" x="468" y="158" width="68" height="20" rx="5"/><text class="btn-pri-text" x="502" y="172" text-anchor="middle">Add app</text>
    <text class="note" x="456" y="214">Tikki copies the icons</text>
    <text class="note" x="456" y="231">into its own storage</text>
  </g>

  <!-- 4: later, updates only when the Admin checks and applies them. -->
  <g class="step step-4">
    <path class="wire" d="M621 132H659" marker-end="url(#tkm-arrow)"/>
    <rect class="station" x="661" y="1" width="178" height="262" rx="14"/>
    <circle class="dot" cx="684" cy="26" r="10"/><text class="dot-n" x="684" y="30" text-anchor="middle">4</text>
    <text class="who" x="702" y="30">LATER</text>
    <text class="title" x="676" y="62">Updates, by hand</text>
    <rect class="box" x="676" y="78" width="148" height="108" rx="8"/>
    <text class="small" x="688" y="100">Check for updates</text>
    <rect class="warn" x="688" y="110" width="124" height="22" rx="5"/><text class="warn-text" x="696" y="125">New origin: confirm</text>
    <rect class="btn-pri" x="688" y="146" width="62" height="20" rx="5"/><text class="btn-pri-text" x="719" y="160" text-anchor="middle">Apply</text>
    <rect class="box" x="756" y="146" width="56" height="20" rx="5"/><text class="btn-text" x="784" y="160" text-anchor="middle">Ignore</text>
    <text class="note" x="676" y="214">Nothing changes without</text>
    <text class="note" x="676" y="231">the Admin</text>
    <path class="wire loop" data-path="" d="M750 263V300H310V266" marker-end="url(#tkm-arrow)"/>
    <text class="note" x="420" y="318">You change the manifest: Tikki fetches it again</text>
  </g>

  <circle class="packet" r="5"/>
</svg>
