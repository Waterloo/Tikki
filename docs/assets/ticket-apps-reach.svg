  <g class="tile-g t-other"><rect class="tile" x="340" y="104" width="54" height="50" rx="8"/><rect class="bar" x="350" y="122" width="34" height="6" rx="3"/><rect class="bar" x="350" y="134" width="24" height="6" rx="3"/></g>
