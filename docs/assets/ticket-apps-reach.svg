  <g class="tile-g t-own"><rect class="tile" x="712" y="44" width="54" height="50" rx="8"/><rect class="bar" x="722" y="62" width="34" height="6" rx="3"/><rect class="bar" x="722" y="74" width="24" height="6" rx="3"/><circle class="mark-own" cx="757" cy="53" r="4"/></g>
