<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" class="tkr" data-steps="4" font-family="Geist, ui-sans-serif, system-ui, sans-serif">
  <style>
    /* Inline on the docs site: the page tokens apply, and docs.js sets data-step. On GitHub the fallback colors apply. */
    .tkr { --t-bg: var(--ui-bg, #ffffff); --t-panel: var(--ui-bg-elevated, #f7f8fa); --t-skel: var(--ui-bg-accented, #e9ebee); --t-line: var(--ui-border-accented, #dadde2);
      --t-hi: var(--ui-text-highlighted, #17181c); --t-muted: var(--ui-text-muted, #5b606b); --t-pri: var(--docs-link, #2563eb); --t-soft: var(--docs-link-soft, #eff4ff); }
    @media (prefers-color-scheme: dark) {
      .tkr { --t-bg: var(--ui-bg, #17181c); --t-panel: var(--ui-bg-elevated, #1e2025); --t-skel: var(--ui-bg-accented, #26282e); --t-line: var(--ui-border-accented, #34373e);
        --t-hi: var(--ui-text-highlighted, #f4f5f7); --t-muted: var(--ui-text-muted, #9ea3ad); --t-pri: var(--docs-link, #60a5fa); --t-soft: var(--docs-link-soft, #172036); }
    }
    .tkr .cred { fill: var(--t-bg); stroke: var(--t-line); }
    .tkr .tile { fill: var(--t-bg); stroke: var(--t-line); transition: fill 0.2s, stroke 0.2s; }
    .tkr .bar { fill: var(--t-skel); }
    .tkr .ref { fill: var(--t-hi); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; font-weight: 600; }
    .tkr .mark-own { fill: #2EC4B6; }
    .tkr .lock { fill: var(--t-muted); }
    .tkr .lock-loop { stroke: var(--t-muted); stroke-width: 1.5; fill: none; }
    .tkr .t-del .tile { stroke-dasharray: 4 3; }
    .tkr .strike { stroke: var(--t-muted); stroke-width: 1.5; }
    .tkr .title { fill: var(--t-hi); font-size: 13.5px; font-weight: 600; }
    .tkr .note { fill: var(--t-muted); font-size: 12px; }
    .tkr .head { fill: var(--t-muted); font-size: 12px; font-weight: 500; }
    .tkr .wire { stroke: var(--t-pri); stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; opacity: 0; }
    .tkr .dot { fill: var(--t-pri); }
    .tkr .dot-n { fill: var(--t-bg); font-size: 11px; font-weight: 700; }
    .tkr .packet { fill: var(--t-pri); opacity: 0; }
    .tkr .step, .tkr .tile-g { transition: opacity 0.2s; }
    .tkr[data-step] .step, .tkr[data-step] .tile-g { opacity: 0.28; }
    .tkr[data-step="1"] .step-1, .tkr[data-step="2"] .step-2, .tkr[data-step="3"] .step-3, .tkr[data-step="4"] .step-4 { opacity: 1; }
    .tkr[data-step="1"] .step-1 .wire, .tkr[data-step="3"] .step-3 .wire, .tkr[data-step="4"] .step-4 .wire { opacity: 1; }
    /* What each credential reaches. */
    .tkr[data-step="1"] .t-open, .tkr[data-step="3"] .t-own, .tkr[data-step="4"] .t-open, .tkr[data-step="4"] .t-own, .tkr[data-step="4"] .t-other { opacity: 1; }
    .tkr[data-step="1"] .t-open .tile, .tkr[data-step="3"] .t-own .tile, .tkr[data-step="4"] .t-open .tile, .tkr[data-step="4"] .t-own .tile, .tkr[data-step="4"] .t-other .tile { fill: var(--t-soft); stroke: var(--t-pri); }
    .tkr[data-step="4"] .t-res { opacity: 0.7; }
    .tkr[data-step="4"] .t-res .tile { stroke: var(--t-pri); stroke-dasharray: 4 3; }
    .tkr[data-step] .packet { opacity: 1; }
  </style>

  <text class="head" x="1" y="26">Credential</text>
  <text class="head" x="340" y="26">Tickets in Tikki</text>

  <g class="step step-1">
    <rect class="cred" x="1" y="44" width="296" height="50" rx="10"/>
    <circle class="dot" cx="24" cy="69" r="10"/><text class="dot-n" x="24" y="73" text-anchor="middle">1</text>
    <text class="title" x="44" y="65">Ticket token <tspan class="note" dx="6">sidebar card, tab</tspan></text><text class="note" x="44" y="82">The one open ticket</text>
    <path class="wire" data-path="" d="M300 69C320 69 451.0 129.0 464.0 129.0"/>
  </g>
  <g class="step step-2">
    <rect class="cred" x="1" y="106" width="296" height="50" rx="10"/>
    <circle class="dot" cx="24" cy="131" r="10"/><text class="dot-n" x="24" y="135" text-anchor="middle">2</text>
    <text class="title" x="44" y="127">Page token <tspan class="note" dx="6">page</tspan></text><text class="note" x="44" y="144">No ticket: it proves who the User is</text>
  </g>
  <g class="step step-3">
    <rect class="cred" x="1" y="168" width="296" height="50" rx="10"/>
    <circle class="dot" cx="24" cy="193" r="10"/><text class="dot-n" x="24" y="197" text-anchor="middle">3</text>
    <text class="title" x="44" y="189">API key, Own tickets</text><text class="note" x="44" y="206">The tickets the Application created</text>
    <path class="wire" data-path="" d="M300 193C330 193 429.0 209.0 429.0 189.0"/>
  </g>
  <g class="step step-4">
    <rect class="cred" x="1" y="230" width="296" height="50" rx="10"/>
    <circle class="dot" cx="24" cy="255" r="10"/><text class="dot-n" x="24" y="259" text-anchor="middle">4</text>
    <text class="title" x="44" y="251">API key, All tickets</text><text class="note" x="44" y="268">Every ticket that is not deleted</text>
    <path class="wire" data-path="" d="M300 255C330 255 553.0 249.0 563.0 219.0"/>
  </g>

  <g class="tile-g t-other"><rect class="tile" x="340" y="44" width="54" height="50" rx="8"/><rect class="bar" x="350" y="62" width="34" height="6" rx="3"/><rect class="bar" x="350" y="74" width="24" height="6" rx="3"/></g>
  <g class="tile-g t-res"><rect class="tile" x="402" y="44" width="54" height="50" rx="8"/><rect class="bar" x="412" y="62" width="34" height="6" rx="3"/><rect class="bar" x="412" y="74" width="24" height="6" rx="3"/><rect class="lock" x="442" y="54" width="9" height="7" rx="1.5"/><path class="lock-loop" d="M444 54v-1.5a2.5 2.5 0 0 1 5 0V54"/></g>
  <g class="tile-g t-other"><rect class="tile" x="464" y="44" width="54" height="50" rx="8"/><rect class="bar" x="474" y="62" width="34" height="6" rx="3"/><rect class="bar" x="474" y="74" width="24" height="6" rx="3"/></g>
