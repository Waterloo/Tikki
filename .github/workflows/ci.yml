name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            e2e/.server.log

  deploy-staging:
    # Every merge to main deploys to staging. Nothing deploys by hand (DECISIONS.md section 11).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the staging settings
        env:
          D1_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
          APP_URL: ${{ vars.STAGING_APP_URL }}
          MAIL_FROM: ${{ vars.STAGING_MAIL_FROM }}
          DOMAINS: ${{ vars.STAGING_ALLOWED_EMAIL_DOMAINS }}
          SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(secret)"
          [ -n "$SECRET" ] || missing="$missing STAGING_BETTER_AUTH_SECRET(secret)"
          [ -n "$D1_ID" ] || missing="$missing STAGING_D1_DATABASE_ID(variable)"
          [ -n "$APP_URL" ] || missing="$missing STAGING_APP_URL(variable)"
          [ -n "$MAIL_FROM" ] || missing="$missing STAGING_MAIL_FROM(variable)"
          [ -n "$DOMAINS" ] || missing="$missing STAGING_ALLOWED_EMAIL_DOMAINS(variable)"
          if [ -n "$missing" ]; then echo "::error::Missing in the GitHub 'staging' environment:$missing"; exit 1; fi

      - name: Point wrangler.jsonc at the staging D1 database
        run: sed -i "s/STAGING_D1_DATABASE_ID/${{ vars.STAGING_D1_DATABASE_ID }}/" wrangler.jsonc

      - run: pnpm build

      # Migrations are forward-only and run before the new code goes live.
      - name: Apply D1 migrations
        run: pnpm wrangler d1 migrations apply DB --env staging --remote

      - name: Deploy
        env:
          SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
        run: |
          secrets_file="$RUNNER_TEMP/secrets.json"
          jq -n --arg s "$SECRET" '{BETTER_AUTH_SECRET: $s}' > "$secrets_file"
          pnpm wrangler deploy --env staging \
            --secrets-file "$secrets_file" \
            --var "APP_URL:${{ vars.STAGING_APP_URL }}" \
            --var "MAIL_FROM:${{ vars.STAGING_MAIL_FROM }}" \
            --var "ALLOWED_EMAIL_DOMAINS:${{ vars.STAGING_ALLOWED_EMAIL_DOMAINS }}" \
            --var "ADMIN_EMAIL:${{ vars.STAGING_ADMIN_EMAIL }}"
          rm -f "$secrets_file"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_APP_URL }}/.well-known/oauth-protected-resource/mcp")
          [ "$code" = "200" ] || { echo "::error::Protected-resource metadata returned $code"; exit 1; }
